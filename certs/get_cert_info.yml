---
- name: Consultar certificado SSL/TLS
  hosts: localhost
  gather_facts: false

  vars:
    destino: 
    puerto: 443

  tasks:

    - name: Obtener certificado del servidor
      community.crypto.get_certificate:
        host: "{{ destino }}"
        port: "{{ puerto }}"
        asn1_base64: true
      register: certificado

    - name: Mostrar información del certificado
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ destino }}"
          - "Puerto: {{ puerto }}"
          - "Subject: {{ certificado.subject }}"
          - "Issuer: {{ certificado.issuer }}"
          - "Serial: {{ certificado.serial_number }}"
          - "Válido desde: {{ certificado.not_before }}"
          - "Válido hasta: {{ certificado.not_after }}"
          - "Expirado: {{ certificado.expired }}"
