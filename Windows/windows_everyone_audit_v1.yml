
---
# ============================================================
# PLAY 1: WINDOWS NTFS PERMISSIONS AUDIT
# ============================================================

- name: Audit Windows NTFS permissions for Everyone
  hosts: all
  gather_facts: false

  tasks:

    - name: Validate audit paths
      ansible.builtin.assert:
        that:
          - audit_paths is defined
          - audit_paths | length > 0
        fail_msg: "No audit paths configured for this server."

    - name: Inspect NTFS permissions for Everyone
      ansible.windows.win_powershell:
        parameters:
          Paths: "{{ audit_paths }}"

        script: |
          param(
              [string[]]$Paths
          )

          $Findings = [System.Collections.Generic.List[object]]::new()
          $Errors = [System.Collections.Generic.List[string]]::new()

          # Discover SMB shares
          try {
              $Shares = @(Get-SmbShare -ErrorAction Stop)
          }
          catch {
              $Shares = @()
              $Errors.Add("Could not enumerate SMB shares: $($_.Exception.Message)")
          }

          foreach ($RootPath in $Paths) {

              if (-not (Test-Path -LiteralPath $RootPath -PathType Container)) {
                  $Errors.Add("Path does not exist: $RootPath")
                  continue
              }

              # Include root directory and all subdirectories
              $RootItem = Get-Item -LiteralPath $RootPath

              $EnumerationErrors = @()

              $Directories = @($RootItem) + @(
                  Get-ChildItem -LiteralPath $RootPath `
                      -Directory `
                      -Recurse `
                      -Force `
                      -ErrorAction SilentlyContinue `
                      -ErrorVariable +EnumerationErrors
              )

              foreach ($EnumerationError in $EnumerationErrors) {
                  $Errors.Add("Directory enumeration: $($EnumerationError.Exception.Message)")
              }

              foreach ($Directory in $Directories) {

                  try {

                      $ACL = Get-Acl -LiteralPath $Directory.FullName -ErrorAction Stop

                      # Find the SMB share containing this directory
                      $CurrentPath = $Directory.FullName.TrimEnd('\')

                      $MatchingShare = $Shares |
                          Where-Object {
                              $SharePath = $_.Path.TrimEnd('\')

                              $CurrentPath.Equals(
                                  $SharePath,
                                  [System.StringComparison]::OrdinalIgnoreCase
                              ) -or $CurrentPath.StartsWith(
                                  $SharePath + '\',
                                  [System.StringComparison]::OrdinalIgnoreCase
                              )
                          } |
                          Sort-Object { $_.Path.Length } -Descending |
                          Select-Object -First 1

                      if ($MatchingShare) {
                          $ShareName = $MatchingShare.Name
                      }
                      else {
                          $ShareName = "Not shared"
                      }

                      foreach ($Permission in $ACL.Access) {

                          try {
                              $SID = $Permission.IdentityReference.Translate(
                                  [System.Security.Principal.SecurityIdentifier]
                              ).Value
                          }
                          catch {
                              $SID = $null
                          }

                          # Everyone SID = S-1-1-0
                          if ($SID -eq "S-1-1-0") {

                              $Findings.Add(
                                  [PSCustomObject]@{
                                      Server      = $env:COMPUTERNAME
                                      ShareName   = $ShareName
                                      Path        = $Directory.FullName
                                      Member      = "Everyone"
                                      Rights      = $Permission.FileSystemRights.ToString()
                                      AccessType  = $Permission.AccessControlType.ToString()
                                      IsInherited = $Permission.IsInherited
                                  }
                              )
                          }
                      }
                  }
                  catch {
                      $Errors.Add(
                          "ACL inspection failed on $($Directory.FullName): $($_.Exception.Message)"
                      )
                  }
              }
          }

          # Return structured results to Ansible
          $Ansible.Result = @{
              findings = @($Findings.ToArray())
              errors   = @($Errors.ToArray())
          }

          $Ansible.Changed = $false

      register: acl_scan
      changed_when: false

    - name: Save audit results
      ansible.builtin.set_fact:
        acl_audit_findings: "{{ acl_scan.result.findings | default([]) }}"
        acl_audit_errors: "{{ acl_scan.result.errors | default([]) }}"
      changed_when: false


# ============================================================
# PLAY 2: CONSOLIDATED REPORT AND CSV EXPORT
# ============================================================

- name: Consolidate Windows audit report
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    csv_report_path: "/tmp/windows_ntfs_permissions_audit.csv"

  tasks:

    # --------------------------------------------------------
    # 1. Initialize report
    # --------------------------------------------------------

    - name: Initialize consolidated report
      ansible.builtin.set_fact:
        audit_report: []
        audit_errors: []

    # --------------------------------------------------------
    # 2. Collect findings from all Windows servers
    # --------------------------------------------------------

    - name: Collect findings from audited Windows servers
      ansible.builtin.set_fact:
        audit_report: >-
          {{
            audit_report +
            (hostvars[item].acl_audit_findings | default([]))
          }}
      loop: "{{ groups['all'] }}"
      loop_control:
        label: "{{ item }}"
      when:
        - item != 'localhost'
        - hostvars[item].acl_audit_findings is defined
      changed_when: false

    # --------------------------------------------------------
    # 3. Collect audit errors
    # --------------------------------------------------------

    - name: Collect errors from Windows servers
      ansible.builtin.set_fact:
        audit_errors: >-
          {{
            audit_errors +
            (
              hostvars[item].acl_audit_errors
              | default([])
              | map('regex_replace', '^', item ~ ': ')
              | list
            )
          }}
      loop: "{{ groups['all'] }}"
      loop_control:
        label: "{{ item }}"
      when:
        - item != 'localhost'
        - hostvars[item].acl_audit_errors is defined
      changed_when: false

    # --------------------------------------------------------
    # 4. Generate CSV report
    # --------------------------------------------------------

    - name: Generate consolidated CSV report
      ansible.builtin.copy:
        dest: "{{ csv_report_path }}"
        mode: '0600'
        content: |
          "Server","ShareName","Path","Member","Rights","AccessType","IsInherited"
          {% for finding in audit_report %}
          "{{ finding.Server | string | replace('"', '""') }}","{{ finding.ShareName | string | replace('"', '""') }}","{{ finding.Path | string | replace('"', '""') }}","{{ finding.Member | string | replace('"', '""') }}","{{ finding.Rights | string | replace('"', '""') }}","{{ finding.AccessType | string | replace('"', '""') }}","{{ finding.IsInherited }}"
          {% endfor %}
      changed_when: false

    # --------------------------------------------------------
    # 5. Display complete consolidated report
    # --------------------------------------------------------

    - name: Display consolidated Windows security audit
      ansible.builtin.debug:
        msg: |
          ================================================================
                       WINDOWS NTFS PERMISSIONS AUDIT
          ================================================================

          SERVER             | SHARENAME          | PATH
          -------------------|--------------------|----------------------------

          {% for finding in audit_report %}
          {{ finding.Server }} | {{ finding.ShareName }} | {{ finding.Path }}
              Member: {{ finding.Member }}
              Rights: {{ finding.Rights }}
              Access: {{ finding.AccessType }}
              Inherited: {{ finding.IsInherited }}

          {% endfor %}
          ================================================================
          TOTAL FINDINGS: {{ audit_report | length }}
          TOTAL ERRORS:   {{ audit_errors | length }}
          ================================================================

          CSV REPORT: {{ csv_report_path }}

          {% if audit_errors | length > 0 %}
          AUDIT ERRORS:
          {% for error in audit_errors %}
          - {{ error }}
          {% endfor %}
          {% endif %}

    # --------------------------------------------------------
    # 6. Display CSV location
    # --------------------------------------------------------

    - name: Confirm CSV report generation
      ansible.builtin.debug:
        msg:
          status: "CSV generated"
          file: "{{ csv_report_path }}"
          records: "{{ audit_report | length }}"
          errors: "{{ audit_errors | length }}"
