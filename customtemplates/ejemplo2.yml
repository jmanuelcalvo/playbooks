apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: dynamic-vm-demo
  title: Dynamic VM API Demo
  description: >
    Demo de un formulario dinámico consultando
    una API externa.

spec:
  owner: user:guest
  type: automation

  parameters:

    - title: Selección de VM

      required:
        - vmId

      properties:

        vmId:
          title: Virtual Machine
          description: Seleccione una VM obtenida desde MockAPI
          type: string
          ui:field: DynamicVmPicker

      dependencies:

        vmId:
          allOf:

            - if:
                properties:
                  vmId:
                    const: "7"

              then:
                properties:

                  reboot:
                    title: ¿Reiniciar la VM?
                    description: >
                      La VM con ID 7 requiere confirmar
                      si desea realizar un reinicio.
                    type: boolean
                    default: false

                required:
                  - reboot

  steps:

    - id: showSelection
      name: Mostrar selección
      action: debug:log

      input:
        message: |
          VM seleccionada
          -------------------------
          VM ID: ${{ parameters.vmId }}

          Reboot:
          ${{ parameters.reboot }}

  output:

    text:

      - title: Resultado
        content: |
          ## VM seleccionada

          **VM ID:** `${{ parameters.vmId }}`

          La selección fue procesada correctamente.
